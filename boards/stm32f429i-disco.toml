name = "stm32f429i-disco"
target = "thumbv7em-none-eabihf"
package = "scars"
features = ["chip-stm32f429"]
kernel_features = ["bench-large"]
test_runner = "probe-rs"
examples_dirs = ["examples/stm32f4"]

[linker]
script = "khal/scars-khal-stm32f4/default.lds"
rustflags = ["-Ctarget-cpu=cortex-m4", "-Ctarget-feature=+vfp4"]

[runner]
program = "probe-rs"
args = [
    "run",
    "--chip", "STM32F429ZITx",
    "--probe", "0483:374b:066AFF505588494867255052",
    "--connect-under-reset",
]
