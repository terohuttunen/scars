name = "nucleo-f446ze"
target = "thumbv7em-none-eabihf"
package = "scars"
features = ["chip-stm32f446"]
test_runner = "probe-rs"
examples_dirs = ["examples/stm32f4"]

[linker]
script = "khal/scars-khal-stm32f4/default.lds"
rustflags = ["-Ctarget-cpu=cortex-m4", "-Ctarget-feature=+vfp4"]

[runner]
program = "probe-rs"
args = [
    "run",
    "--chip", "STM32F446ZETx",
    "--probe", "0483:374b:066CFF575487884867184855",
    "--connect-under-reset",
]
