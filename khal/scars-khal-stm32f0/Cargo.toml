[package]
name = "scars-khal-stm32f0"
version = "0.1.0"
authors = ["Tero Huttunen <tero.huttunen@ultic.io>"]
edition = "2024"
build = "build.rs"
license = "MIT/Apache-2.0"
repository = "https://github.com/terohuttunen/scars/"

[lib]
bench = false
doctest = false
test = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7.3"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
scars-khal = { path = "../../scars-khal" }
scars-arch-cortex-m0 = { path = "../../scars-arch-cortex-m0" }
critical-section = "1.1.1"
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }

[dependencies.stm32f0]
version = "0.16.0"
default-features = false
# `rt` is mandatory — pulls in the chip's interrupt vector table.
features = ["critical-section", "rt"]

[features]
# Exactly one chip feature must be selected by the board manifest.
# `stm32f0x1` covers the F050/F051/F071/F091 family (Discovery uses
# F051R8, which is part of stm32f0x1).
stm32f0x1 = ["stm32f0/stm32f0x1"]
