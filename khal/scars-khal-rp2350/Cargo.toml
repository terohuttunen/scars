[package]
name = "scars-khal-rp2350"
version = "0.1.0"
authors = ["Tero Huttunen <tero.huttunen@ultic.io>"]
edition = "2024"
build = "build.rs"
license = "MIT/Apache-2.0"
repository = "https://github.com/terohuttunen/scars/"

[lib]
bench = false
doctest = false
test = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7.3"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
scars-khal = { path = "../../scars-khal" }
scars-arch-cortex-m = { path = "../../scars-arch-cortex-m" }
critical-section = "1.1.1"
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }

[dependencies.rp235x-pac]
version = "0.2.0"
default-features = false
# `rt` is mandatory — pulls in the chip's interrupt vector table so
# named ISRs (TIMER0_IRQ_0 etc.) land at the right offsets.
features = ["critical-section", "rt"]

[features]
# Single chip variant — all RP2350 SKUs share the same silicon core.
rp2350 = []
