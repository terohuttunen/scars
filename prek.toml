#:schema https://www.schemastore.org/prek.json
# See https://prek.j178.dev for prek documentation
# See https://pre-commit.com/hooks.html for the upstream hook catalogue

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all -- --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false },
  { id = "cargo-check-sim",
    name = "cargo xtask check --board sim",
    entry = "cargo xtask check --board sim",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-push"] },
]
