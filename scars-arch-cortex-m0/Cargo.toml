[package]
name = "scars-arch-cortex-m0"
version = "0.1.0"
edition = "2024"
authors = ["Tero Huttunen <tero.huttunen@ultic.io>"]
license = "MIT/Apache-2.0"
repository = "https://github.com/terohuttunen/scars/"

[lib]
test = false

[dependencies]
aligned = "0.4.2"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7.3"
defmt = "1.0.1"
scars-khal = { version = "0.1.0", path = "../scars-khal" }
scars-fault = { path = "../scars-fault" }
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }
semihosting = { version = "0.1.20", optional = true }

[features]
default = ["semihosting"]
semihosting = ["dep:semihosting"]
