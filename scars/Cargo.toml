[dependencies]
bit_field = "0.10.2"
bitflags = { version = "2.4", default-features = false }
const_env = "0.1.2"
critical-section = { version = "1.1.1" }
portable-atomic = { version = "1", default-features = false }
defmt = { version = "1.0.1", optional = true }
static_cell = "2.1.0"
scars-khal = { version = "0.1.0", path = "../scars-khal" }
scars-macros = { version = "0.1.0", path = "../scars-macros" }
scars-khal-e310x = { version = "0.1.0", path = "../khal/scars-khal-e310x", features = [
    "semihosting",
], optional = true }
scars-khal-stm32f0 = { version = "0.1.0", path = "../khal/scars-khal-stm32f0", optional = true }
scars-khal-stm32f1 = { version = "0.1.0", path = "../khal/scars-khal-stm32f1", optional = true }
scars-khal-stm32f4 = { version = "0.1.0", path = "../khal/scars-khal-stm32f4", optional = true }
scars-khal-stm32h7 = { version = "0.1.0", path = "../khal/scars-khal-stm32h7", optional = true }
scars-khal-rp2350 = { version = "0.1.0", path = "../khal/scars-khal-rp2350", optional = true }
scars-khal-sim = { version = "0.1.0", path = "../khal/scars-khal-sim", optional = true }
scars-khal-test = { version = "0.1.0", path = "../khal/scars-khal-test", optional = true }
scars-test = { version = "0.1.0", path = "../scars-test" }
aligned = "0.4.2"
pin-project = "1.1.7"
scars-fault = { version = "0.1.0", path = "../scars-fault" }


[dev-dependencies]
scars-test = { version = "0.1.0", path = "../scars-test" }
scars-bench = { version = "0.1.0", path = "../scars-bench" }

[target.'cfg(target_arch = "riscv32")'.dev-dependencies]
semihosting = { version = "0.1.4", features = ["stdio"] }

[target.'cfg(target_arch = "arm")'.dependencies]
semihosting = { version = "0.1.4" }
#scars-test = { version = "0.1.0", path = "../scars-test" }


[features]
default = ["multithreading", "priority-inheritance", "raii-locks"]
tracing = []
# Multi-threading: allow creation of threads. Without multithreading
# only idle thread, interrupts and event handlers are available.
multithreading = []
# Priority-inheritance mutex protocol (`InheritanceLock` and the default
# `Mutex` alias). Opt out to drop its code and per-thread state; ceiling
# and interrupt mutexes are independent and remain available. Requires
# `multithreading` (a thread inherits priority from a blocked waiter).
priority-inheritance = ["multithreading"]
# RAII guard-style locking: `Guarded`/`Guard`, the `Mutex`/`CeilingMutex`/
# `InterruptMutex` aliases, `Condvar`, `Shared`, and the scoped ceiling-lock
# objects (`CeilingLock` + the per-thread/per-interrupt owned-lock lists).
# Opt out to keep only the closure-based primitives (`Channel`, `Semaphore`,
# `Notify`, `Rendezvous`, `OnceLock`), which use the `NestingLock` API.
raii-locks = ["multithreading"]
# Multi-core support. Orthogonal to `multithreading`: each core runs its
# own idle thread, interrupts, and event handlers with no cross-core
# context switching, so it applies with or without `multithreading`.
multi-core = []
defmt = ["dep:defmt", "scars-fault/defmt"]
display = ["scars-fault/display"]
khal-e310x = [
    "dep:scars-khal-e310x",
    "scars-test/semihosting",
    "scars-bench/semihosting",
    "defmt",
]
khal-sim = ["dep:scars-khal-sim", "scars-test/std", "scars-bench/std", "defmt"]
# Synchronous test-harness backend. No defmt (hence `display` for the
# fault formatter), no linker script: a plain host `cargo test` target.
khal-test = ["dep:scars-khal-test", "scars-test/std", "scars-bench/std", "display"]
# KHAL-family features pull in the optional dep + test/log backend.
# Internal building blocks — board manifests should pick a chip
# feature (below) rather than enabling these directly.
khal-stm32f0 = [
    "dep:scars-khal-stm32f0",
    "scars-test/rtt",
    "scars-bench/rtt",
    "defmt",
]
khal-stm32f1 = [
    "dep:scars-khal-stm32f1",
    "scars-test/rtt",
    "scars-bench/rtt",
    "defmt",
]
khal-stm32f4 = [
    "dep:scars-khal-stm32f4",
    "scars-test/rtt",
    "scars-bench/rtt",
    "defmt",
]
khal-stm32h7 = [
    "dep:scars-khal-stm32h7",
    "scars-test/rtt",
    "scars-bench/rtt",
    "defmt",
]
khal-rp2350 = [
    "dep:scars-khal-rp2350",
    "scars-test/rtt",
    "scars-bench/rtt",
    "defmt",
]
# Capability marker enabled by board manifests with enough RAM for
# the multi-thread benches (currently `sched`, which needs ~9KB .bss).
# Declared on the board (not transitively via chip-*) so xtask's
# required-features check sees it without doing feature resolution.
# Excluded by the stm32f0discovery manifest (F051 has 8KB SRAM).
bench-large = []
# Chip features — what board manifests enable. Each pulls in the
# matching KHAL family + the chip-specific feature on the underlying
# KHAL crate.
chip-stm32f051 = ["khal-stm32f0", "scars-khal-stm32f0/stm32f0x1"]
chip-stm32f103 = ["khal-stm32f1", "scars-khal-stm32f1/stm32f103"]
chip-stm32f429 = ["khal-stm32f4", "scars-khal-stm32f4/stm32f429"]
chip-stm32f446 = ["khal-stm32f4", "scars-khal-stm32f4/stm32f446"]
chip-stm32h753v = ["khal-stm32h7", "scars-khal-stm32h7/stm32h753v"]
chip-rp2350 = ["khal-rp2350", "scars-khal-rp2350/rp2350", "multi-core"]
