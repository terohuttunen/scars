[package]
name = "scars"
version = "0.1.0"
authors = ["Tero Huttunen <tero.huttunen@ultic.io>"]
edition = "2024"
license = "MIT/Apache-2.0"
repository = "https://github.com/terohuttunen/scars/"
keywords = ["RTOS"]
description = "RTOS for hard real-time applications"


[lib]

[[test]]
name = "block"
harness = false

[[test]]
name = "event_handler01"
harness = false

[[test]]
name = "event_handler02"
harness = false

[[test]]
name = "events01"
harness = false

[[test]]
name = "events02"
harness = false

[[test]]
name = "events03"
harness = false

[[test]]
name = "inheritance01"
harness = false

[[test]]
name = "locking01"
harness = false

[[test]]
name = "locking02"
harness = false

[[test]]
name = "locking03"
harness = false

[[test]]
name = "locking04"
harness = false

[[test]]
name = "locking05"
harness = false

[[test]]
name = "locking06"
harness = false

[[test]]
name = "make_task"
harness = false

[[test]]
name = "nopreempt"
harness = false

[[test]]
name = "preempt"
harness = false

[[test]]
name = "yield"
harness = false

[dependencies]
bit_field = "0.10.2"
bitflags = { version = "2.4", default-features = false }
const_env = "0.1.2"
critical-section = { version = "1.1.1" }
static_cell = "2.1.0"
scars-khal = { version = "0.1.0", path = "../scars-khal" }
scars-macros = { version = "0.1.0", path = "../scars-macros" }
scars-khal-e310x = { version = "0.1.0", path = "../khal/scars-khal-e310x", features = ["semihosting"], optional = true }
scars-khal-stm32f4 = { version = "0.1.0", path = "../khal/scars-khal-stm32f4", optional = true }
scars-khal-sim = { version = "0.1.0", path = "../khal/scars-khal-sim", optional = true }
scars-test = { version = "0.1.0", path = "../scars-test" }
aligned = "0.4.2"
pin-project = "1.1.7"
scars-fault = { version = "0.1.0", path="../scars-fault" }


[dev-dependencies]
scars-test = { version = "0.1.0", path = "../scars-test" }

[target.'cfg(target_arch = "riscv32")'.dev-dependencies]
semihosting = { version = "0.1.4", features = ["stdio"] }

[target.'cfg(target_arch = "arm")'.dependencies]
semihosting = { version = "0.1.4" }
#scars-test = { version = "0.1.0", path = "../scars-test" }


[features]
default = ["relative-delay"]
tracing = []
relative-delay = []
khal-e310x = ["dep:scars-khal-e310x", "scars-test/semihosting"]
khal-sim = ["dep:scars-khal-sim", "scars-test/std"]
khal-stm32f4 = ["dep:scars-khal-stm32f4", "scars-test/rtt"]
